[package]
name = "ukrop"
version = "0.14.0"
edition = "2021"
description = "Quick directory jumping & command execution with fuzzy TUI"
license = "MIT"
repository = "https://github.com/ukroporg/ukrop"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
nucleo-matcher = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
anyhow = "1"
signal-hook = "0.3"
libc = "0.2"

[[bin]]
name = "ukrop"
path = "src/main.rs"

[[bin]]
name = "u"
path = "src/bin/u.rs"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "ukroporg"
copyright = "2026, ukroporg"
extended-description = "Quick directory jumping & command execution with fuzzy TUI"
section = "utils"
priority = "optional"
assets = [
    ["target/release/ukrop", "usr/bin/", "755"],
    ["target/release/u", "usr/bin/", "755"],
]
